name: Hyperliquid Auto Rebalance

on:
  schedule:
    - cron: '*/7 * * * *'  # Toutes les 7 minutes
  workflow_dispatch:      # Permet de lancer manuellement

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hyperliquid-python-sdk eth-account

      - name: Run rebalance script
        env:
          HYPERLIQUID_SECRET_KEY: ${{ secrets.HYPERLIQUID_SECRET_KEY }}
          HYPERLIQUID_ADDRESS: ${{ secrets.HYPERLIQUID_ADDRESS }}
        run: python rebalance.py
